<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <h1 class="display-5 fw-bold mb-4">Contact Us</h1>
      <p class="lead text-muted mb-5">
        Have a question, suggestion, or just want to say hello? We'd love to hear from you.
        Fill out the form below and we'll get back to you as soon as possible.
      </p>

      <div class="card shadow-sm">
        <div class="card-body p-4">
          <form>
            <div class="mb-3">
              <label for="name" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="name" placeholder="Enter your name" />
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <input type="email" class="form-control" id="email" placeholder="name&#64;example.com" />
            </div>
            <div class="mb-3">
              <label for="subject" class="form-label">Subject</label>
              <input type="text" class="form-control" id="subject" placeholder="What is this about?" />
            </div>
            <div class="mb-3">
              <label for="message" class="form-label">Message</label>
              <textarea class="form-control" id="message" rows="5" placeholder="Type your message here..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Send Message</button>
          </form>
        </div>
      </div>

      <div class="row mt-5 text-center">
        <div class="col-md-4 mb-3">
          <h5 class="fw-bold">Email</h5>
          <p class="text-muted">hello&#64;angulartest.com</p>
        </div>
        <div class="col-md-4 mb-3">
          <h5 class="fw-bold">Phone</h5>
          <p class="text-muted">+1 (555) 123-4567</p>
        </div>
        <div class="col-md-4 mb-3">
          <h5 class="fw-bold">Location</h5>
          <p class="text-muted">123 Angular Way, Web City</p>
        </div>
      </div>
    </div>
  </div>
</div>
