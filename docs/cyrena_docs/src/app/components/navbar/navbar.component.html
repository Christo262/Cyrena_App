<nav class="navbar navbar-expand-lg navbar-dark sticky-top"
  style="background: #2b2b2b; border-bottom: 1px solid #3d3d3d; box-shadow: 0 1px 4px rgba(0,0,0,0.4);">
  <div class="container">
    <a class="navbar-brand fw-bold d-flex align-items-center" href="/index.html">
      <span class="brand-icon rounded-3 d-inline-flex align-items-center justify-content-center me-2"
        style="width: 36px; height: 36px; background: #e95420;">
        <img src="favicon.ico" class="img-fluid mh-100" alt="Cyréna" />
      </span>
      <span>Cyréna</span>
    </a>
    <button class="navbar-toggler border-0" type="button" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen()">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" [class.show]="isMenuOpen()">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
        @for (item of navItems(); track item.route) {
        <li class="nav-item">
          @if (item.external) {
          <a class="nav-link px-3 py-2 rounded-2" [href]="item.route" (click)="isMenuOpen.set(false)">
            {{ item.label }}
          </a>
          } @else {
          <a class="nav-link px-3 py-2 rounded-2" [routerLink]="item.route"
            routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.route === '/docs' }"
            (click)="isMenuOpen.set(false)">
            {{ item.label }}
          </a>
          }
        </li>
        }
      </ul>
      <a href="https://github.com/Christo262/Cyrena_App" target="_blank" rel="noopener"
        class="btn btn-outline-light btn-sm ms-lg-3">
        <i class="bi bi-github me-1"></i>GitHub
      </a>
    </div>
  </div>
</nav>
