name: Build

on:
  push:
    branches:
      - master
      - v0.6.0
  pull_request:
    branches:
      - master
      - v0.6.0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run tests
        run: dotnet test --configuration Release --no-restore

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: windows-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Publish Windows ${{ matrix.arch }}
        run: dotnet publish src/Cyrena.Shell/Cyrena.Shell.csproj -c Release -r win-${{ matrix.arch }} -o ./build/windows/${{ matrix.arch }}

      - name: Upload Windows ${{ matrix.arch }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: cyrena-windows-${{ matrix.arch }}
          path: ./build/windows/${{ matrix.arch }}
          retention-days: 1

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/linux/cyrena-electron/package-lock.json

      - name: Publish Linux x64
        run: dotnet publish src/Cyrena.Shell/Cyrena.Shell.csproj -c Release -r linux-x64 -o ./build/linux/x64

      - name: Publish Linux arm64
        run: dotnet publish src/Cyrena.Shell/Cyrena.Shell.csproj -c Release -r linux-arm64 -o ./build/linux/arm64

      - name: Install dependencies (cyrena-electron)
        working-directory: src/linux/cyrena-electron
        run: npm ci

      - name: Build electron app (both arches)
        working-directory: src/linux/cyrena-electron
        run: npm run dist

      - name: Sort AppImages into webview folders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./build/linux/x64/webview ./build/linux/arm64/webview

          x64_file=$(find src/linux/cyrena-electron/dist -name "*.AppImage" \( -name "*x86_64*" -o -name "*x64*" \) -print -quit)
          arm64_file=$(find src/linux/cyrena-electron/dist \( -name "*arm64*.AppImage" -o -name "*aarch64*.AppImage" \) -print -quit)

          if [ -z "$x64_file" ]; then
            echo "::error::No x64 AppImage found"
            exit 1
          fi
          if [ -z "$arm64_file" ]; then
            echo "::error::No arm64 AppImage found"
            exit 1
          fi

          cp "$x64_file" ./build/linux/x64/webview/
          cp "$arm64_file" ./build/linux/arm64/webview/

      - name: Upload Linux x64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: cyrena-linux-x64
          path: ./build/linux/x64
          retention-days: 1

      - name: Upload Linux arm64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: cyrena-linux-arm64
          path: ./build/linux/arm64
          retention-days: 1

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Publish macOS ${{ matrix.arch }}
        run: dotnet publish src/Cyrena.Shell/Cyrena.Shell.csproj -c Release -r osx-${{ matrix.arch }} -o ./build/macos/${{ matrix.arch }}

      - name: Upload macOS ${{ matrix.arch }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: cyrena-macos-${{ matrix.arch }}
          path: ./build/macos/${{ matrix.arch }}
          retention-days: 1
